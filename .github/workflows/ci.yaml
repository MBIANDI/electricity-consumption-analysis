name: CI
run-name: "CI - ${{ github.head_ref || github.ref_name }}"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ${{ vars.PUBLIC_RUNNER_IMAGE }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras --group dev

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Ruff lint
        # --output-format=github turns each finding into a workflow annotation, which
        # GitHub renders on the diff line in the PR as well as in the job log.
        run: uv run --no-sync ruff check --output-format=github .

      - name: ty type check
        run: uv run --no-sync ty check
